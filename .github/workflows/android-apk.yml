name: Build Monster Tracker APK

on:
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: Run the SQLite tests on an Android emulator in airplane mode
        type: boolean
        default: true
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: monster-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out existing source
        uses: actions/checkout@v4

      # Supports normal checkouts and phone uploads of this existing source ZIP.
      - name: Locate existing Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/app/build.gradle" ]]; then
            project="$GITHUB_WORKSPACE"
          elif [[ -f "$GITHUB_WORKSPACE/monster-tracker-android/app/build.gradle" ]]; then
            project="$GITHUB_WORKSPACE/monster-tracker-android"
          elif [[ -f "$GITHUB_WORKSPACE/monster-tracker-android-source.zip" ]]; then
            unzip -q "$GITHUB_WORKSPACE/monster-tracker-android-source.zip" -d "$RUNNER_TEMP/monster-source"
            project="$RUNNER_TEMP/monster-source/monster-tracker-android"
          else
            echo 'Existing project not found. Upload monster-tracker-android-source.zip or the extracted source.' >&2
            exit 1
          fi
          test -f "$project/settings.gradle"
          test -f "$project/app/src/main/AndroidManifest.xml"
          echo "path=$project" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35 and build tools
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # A cache helps keep the test APK's signing key stable between builds.
      # It is not a durable substitute for a release keystore you own and back up.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: monster-debug-signing-key-v1

      - name: Run existing host checks
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          bash scripts/test-core.sh 2>&1 | tee reports/host-tests.txt

      - name: Compile, run Android unit tests and assemble APKs
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee reports/gradle-build.txt

      - name: Enable emulator acceleration
        if: github.event_name != 'workflow_dispatch' || inputs.run_device_tests
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Test native SQLite on Android in airplane mode
        if: github.event_name != 'workflow_dispatch' || inputs.run_device_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ${{ steps.project.outputs.path }}
          script: |
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell settings get global airplane_mode_on | tr -d '\r' | grep -qx 1
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w au.monster.tracker.test/au.monster.tracker.DatabaseTestRunner | tee reports/device-tests.txt
            grep -F 'DEVICE RESULTS: 9 passed, 0 failed.' reports/device-tests.txt

      - name: Verify and package the installable APK
        id: verified
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-apk.sh 2>&1 | tee reports/apk-verification.txt
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Monster-Tracker-debug.apk
          cp reports/apk-verification.txt dist/
          (cd dist && sha256sum Monster-Tracker-debug.apk > SHA256SUMS.txt)
          cat > dist/INSTALL.txt <<'INSTALL'
          Extract this artifact ZIP on Android. Open Monster-Tracker-debug.apk in Files.
          Permit Install unknown apps for Files when Android asks, then install.
          Requires Android 8.0 or newer. No internet, account or server is needed to use the app.
          Back up existing records in Settings > Export full JSON backup before uninstalling or changing signing keys.
          INSTALL
          echo "apk=$PWD/dist/Monster-Tracker-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload verified APK for phone installation
        uses: actions/upload-artifact@v4
        with:
          name: monster-tracker-debug-apk
          path: ${{ steps.project.outputs.path }}/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build and test reports
        if: always() && steps.project.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: monster-tracker-build-reports
          path: |
            ${{ steps.project.outputs.path }}/reports/
            ${{ steps.project.outputs.path }}/app/build/reports/tests/
            ${{ steps.project.outputs.path }}/app/build/test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize successful verification
        shell: bash
        run: |
          echo '### Verified debug APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **monster-tracker-debug-apk** from this run’s Artifacts section.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compilation, Android unit tests, ZIP/package/DEX/signature checks and zero-permission checks passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Device SQLite tests run when enabled. This is not a claim of physical-phone UI verification.' >> "$GITHUB_STEP_SUMMARY"
