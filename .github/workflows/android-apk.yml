name: Build Monster Tracker APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android source archive if present
        shell: bash
        run: |
          if [ -f monster-tracker-android-source.zip ]; then
            unzip -q monster-tracker-android-source.zip
          fi
          if [ -d monster-tracker-android ]; then
            cp -a monster-tracker-android/. .
          fi
          test -f app/build.gradle || { echo 'Android source missing'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: bash gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monster-tracker-apk
          path: app/build/outputs/apk/debug/*.apk
