name: JTC Drinks admin checks
on:
  push:
    branches: [feature/jtc-drinks-supabase-admin]
  pull_request:
    branches: [main]
    paths:
      - 'universal/**'
      - 'app/src/main/java/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/jtc-admin-check.yml'
  workflow_dispatch:
permissions:
  contents: read

# Avoid running the same emulator upgrade test twice for a push and its PR.
concurrency:
  group: jtc-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MONSTER_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/monster-plus-debug.keystore
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse existing Android signing key
        uses: actions/cache@v4
        with:
          path: ${{ env.MONSTER_DEBUG_KEYSTORE }}
          key: monster-plus-debug-signing-key-v1
      - name: Ensure shared signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MONSTER_DEBUG_KEYSTORE")"
          if [[ ! -f "$MONSTER_DEBUG_KEYSTORE" ]]; then
            keytool -genkeypair -keystore "$MONSTER_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: universal
        run: flutter pub get
      - name: Analyze
        working-directory: universal
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        working-directory: universal
        run: flutter test
      - name: Generate Android build files and preserve Business Tracker identity
        working-directory: universal
        shell: bash
        run: |
          set -euo pipefail
          scaffold="$(mktemp -d)"
          flutter create --platforms=android --org au.monster --project-name tracker --no-pub "$scaffold/tracker"
          rm -f "$scaffold/tracker/android/app/src/main/kotlin/au/monster/tracker/MainActivity.kt"
          cp -Rn "$scaffold/tracker/android/." android/
          test -f android/app/src/main/java/au/monster/tracker/MainActivity.java
          grep -q 'android:name="au.monster.tracker.MainActivity"' android/app/src/main/AndroidManifest.xml
          # Preserve the existing installed Android application ID and version.
          sed -i 's/applicationId = "au.monster.tracker"/applicationId = "au.monster.tracker.plus"/' android/app/build.gradle.kts
          sed -i 's/versionCode = flutter.versionCode/versionCode = 21/' android/app/build.gradle.kts
          sed -i 's/versionName = flutter.versionName/versionName = "2.3.4"/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          # The preserved native ledger uses Java records and requires Java 17.
          sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' android/app/build.gradle.kts
          sed -i 's/jvmTarget = "11"/jvmTarget = "17"/g' android/app/build.gradle.kts
          grep -q 'JavaVersion.VERSION_17' android/app/build.gradle.kts
          grep -q 'applicationId = "au.monster.tracker.plus"' android/app/build.gradle.kts
          grep -q 'versionCode = 21' android/app/build.gradle.kts
          grep -q 'versionName = "2.3.4"' android/app/build.gradle.kts
          grep -q 'minSdk = 26' android/app/build.gradle.kts
          # Flutter's migration bridge calls the existing native SQLite/backup code.
          mkdir -p android/app/src/main/java/au/monster/tracker android/app/src/main/assets
          find ../app/src/main/java/au/monster/tracker -maxdepth 1 -name '*.java' ! -name 'MainActivity.java' -exec cp {} android/app/src/main/java/au/monster/tracker/ \;
          cp ../app/src/main/assets/*.sql android/app/src/main/assets/
          # Keep the custom Flutter MainActivity, but include its Google authorization
          # and the native receipt OCR/barcode dependencies used by the existing code.
          cat >> android/app/build.gradle.kts <<'GRADLE'

          dependencies {
              implementation("com.google.android.gms:play-services-auth:21.3.0")
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.mlkit:barcode-scanning:17.3.0")
              implementation("androidx.exifinterface:exifinterface:1.3.7")
              implementation("com.stripe:stripeterminal-taptopay:6.0.0")
              implementation("com.stripe:stripeterminal-core:6.0.0")
          }
          GRADLE
          # Use the same persistent debug signing key as the existing Android workflow.
          cat >> android/app/build.gradle.kts <<'GRADLE'

          android {
              signingConfigs {
                  create("sharedDebug") {
                      storeFile = file(System.getenv("MONSTER_DEBUG_KEYSTORE"))
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("sharedDebug")
                  }
              }
          }
          GRADLE
      - name: Download existing signed APK baseline
        uses: actions/download-artifact@v4
        with:
          name: monster-tracker-apk
          run-id: 38409682236
          github-token: ${{ github.token }}
          path: upgrade-baseline
      - name: Build debug APK
        working-directory: universal
        run: flutter build apk --debug
      - name: Verify APK package and version
        working-directory: universal
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BT/aapt" dump badging "$APK" | grep -F "package: name='au.monster.tracker.plus' versionCode='21' versionName='2.3.4'"
          baseline="$(find ../upgrade-baseline -name '*.apk' -type f | head -n 1)"
          test -n "$baseline"
          baseline_cert="$("$BT/apksigner" verify --print-certs "$baseline" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          current_cert="$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$baseline_cert" && test -n "$current_cert"
          if [[ "$baseline_cert" != "$current_cert" ]]; then
            echo "Signing certificate mismatch: this APK cannot update the verified existing installation." >&2
            echo "Baseline: $baseline_cert" >&2
            echo "Current:  $current_cert" >&2
            exit 1
          fi
          echo "APK package, version, signature presence and compatibility with the verified baseline passed."
      - name: Test existing-install upgrade and startup on Android emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            echo 'Waiting up to 3 minutes for the Android device...'
            timeout 180 adb wait-for-device
            boot_deadline=$((SECONDS + 180))
            until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" == '1' ]]; do
              if (( SECONDS >= boot_deadline )); then
                echo 'Emulator did not finish booting within 3 minutes.' >&2
                adb devices -l || true
                adb logcat -d -t 200 || true
                exit 1
              fi
              sleep 5
            done
            echo 'Emulator boot completed.'
            baseline="$(find upgrade-baseline -name '*.apk' -type f | head -n 1)"
            test -n "$baseline"
            timeout 120 adb install "$baseline"
            timeout 60 adb shell am start -W -n au.monster.tracker.plus/au.monster.tracker.MainActivity
            sleep 3
            timeout 30 adb shell am force-stop au.monster.tracker.plus
            timeout 120 adb install -r universal/build/app/outputs/flutter-apk/app-debug.apk
            adb logcat -c
            timeout 60 adb shell am start -W -n au.monster.tracker.plus/au.monster.tracker.MainActivity
            sleep 8
            adb shell pidof au.monster.tracker.plus
            adb shell run-as au.monster.tracker.plus test -s databases/business-tracker-v1.db
            if adb logcat -d | grep -E 'FATAL EXCEPTION|MIGRATION_BLOCKED'; then
              echo "App crash or migration blocker detected during emulator smoke test." >&2
              exit 1
            fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: business-tracker-2.3.4-debug-apk
          path: universal/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
