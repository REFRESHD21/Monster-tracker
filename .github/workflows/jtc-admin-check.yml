name: JTC Drinks admin checks
on:
  push:
    branches: [feature/jtc-drinks-supabase-admin]
  pull_request:
    branches: [main]
    paths:
      - 'universal/**'
      - '.github/workflows/jtc-admin-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: universal
        run: flutter pub get
      - name: Analyze
        working-directory: universal
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        working-directory: universal
        run: flutter test
      - name: Generate missing Android Gradle scaffolding without replacing app identity
        working-directory: universal
        shell: bash
        run: |
          set -euo pipefail
          scaffold="$(mktemp -d)"
          flutter create --platforms=android --org au.monster --project-name tracker --no-pub "$scaffold/tracker"
          rm -f "$scaffold/tracker/android/app/src/main/kotlin/au/monster/tracker/MainActivity.kt"
          cp -Rn "$scaffold/tracker/android/." android/
          test -f android/app/src/main/java/au/monster/tracker/MainActivity.java
          grep -q 'android:name="au.monster.tracker.MainActivity"' android/app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "au.monster.tracker"' android/app/build.gradle.kts
          # The existing backup_destination plugin requires API 26. This is an explicit
          # compatibility floor, not an override of the existing package/application ID.
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          grep -q 'minSdk = 26' android/app/build.gradle.kts
      - name: Build debug APK
        working-directory: universal
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: business-tracker-2.3.3-debug-apk
          path: universal/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
