name: business_tracker
description: Offline business inventory, sales and receipts for Android and iOS.
publish_to: none
version: 2.1.1+14
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  backup_destination:
    path: packages/backup_destination
  crypto: ^3.0.6
  cryptography: ^2.7.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  mobile_scanner: ^7.1.3
  flutter_secure_storage: ^9.2.4
  workmanager: 0.9.0+3
  workmanager_android: 0.9.0+2
  workmanager_apple: 0.9.1+2
  workmanager_platform_interface: 0.9.1+1
  google_mlkit_text_recognition: ^0.15.0
  uuid: ^4.5.1
  google_sign_in: 6.3.0
  url_launcher: ^6.3.2
dev_dependencies:
  sqflite_common_ffi: ^2.3.6
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
