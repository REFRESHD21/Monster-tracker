plugins { id 'com.android.application' }
android {
    namespace 'au.monster.tracker'
    compileSdk 35
    defaultConfig {
        applicationId 'au.monster.tracker.plus'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'au.monster.tracker.DatabaseTestRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            if (System.getenv('MONSTER_DEBUG_KEYSTORE')) {
                storeFile file(System.getenv('MONSTER_DEBUG_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (System.getenv('MONSTER_KEYSTORE')) {
                storeFile file(System.getenv('MONSTER_KEYSTORE'))
                storePassword System.getenv('MONSTER_STORE_PASSWORD')
                keyAlias System.getenv('MONSTER_KEY_ALIAS')
                keyPassword System.getenv('MONSTER_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.debug
            if (System.getenv('MONSTER_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}

// Test-only dependency; it is not packaged into the offline app.
dependencies {
    implementation 'com.stripe:stripeterminal-taptopay:6.0.0'
    implementation 'com.stripe:stripeterminal-core:6.0.0'
    testImplementation 'junit:junit:4.13.2'
}
